<section class="upload-card">
  <span class="card-label">Entrada</span>

  <div class="dropzone" (click)="fileInput.click()">
    <input #fileInput type="file" accept=".xml" hidden (change)="onFileChange($event)">
    <div class="dropzone-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
        <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
        <path d="M12 12v6"/>
        <path d="m15 15-3-3-3 3"/>
      </svg>
    </div>
    <p>Arraste o arquivo XML aqui</p>
    <small>ou clique para selecionar · máx. 2MB · .xml</small>
  </div>

  <span class="card-divider">Ou cole o xml</span>

  <textarea class="xml-textarea" placeholder='<?xml version="1.0" encoding="UTF-8"? >'
            [(ngModel)]="xmlTextAreaContent"></textarea>

  <div class="actions-row">
    <button class="analyse-import-bt" (click)="emitValue()">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      Analisar e Importar
    </button>
    <button class="example-bt" (click)="fillTextAreaWithExample()">Exemplo</button>
    <button class="clean-bt" (click)="removeTextFromTextArea()">Limpar</button>
  </div>
</section>
