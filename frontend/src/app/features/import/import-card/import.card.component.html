<section class="upload-card">
  <span class="card-label">Intake</span>

  <div class="dropzone" (click)="fileInput.click()">
    <input #fileInput type="file" accept=".xml" hidden (change)="onFileChange($event)">
    <div class="dropzone-code">XML</div>
    @if (selectedFile) {
      <p>{{ selectedFile.name }}</p>
      <small>file selected · click to replace</small>
    } @else {
      <p>Select XML file</p>
      <small>click to choose · max. 5 MB · .xml</small>
    }
  </div>

  <span class="card-divider">or paste the XML</span>

  <textarea class="xml-textarea" placeholder='<?xml version="1.0" encoding="UTF-8"?>'
            [(ngModel)]="xmlTextAreaContent"></textarea>

  <div class="actions-row">
    <button class="btn btn--primary analyse" (click)="emitValue()">
      Analyze and import
    </button>
    <button class="btn btn--ghost" (click)="fillTextAreaWithExample()">Example</button>
    <button class="btn btn--ghost" (click)="removeTextFromTextArea()">Clear</button>
  </div>
</section>
