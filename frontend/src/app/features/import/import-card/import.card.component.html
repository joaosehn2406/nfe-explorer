<section class="upload-card">
  <span class="card-label">{{ 'import.intake' | translate }}</span>

  <div class="dropzone" (click)="fileInput.click()">
    <input #fileInput type="file" accept=".xml" hidden (change)="onFileChange($event)">
    <div class="dropzone-code">XML</div>
    @if (selectedFile) {
      <p>{{ selectedFile.name }}</p>
      <small>{{ 'import.fileSelected' | translate }}</small>
    } @else {
      <p>{{ 'import.selectXmlFile' | translate }}</p>
      <small>{{ 'import.dropHint' | translate }}</small>
    }
  </div>

  <span class="card-divider">{{ 'import.orPasteXml' | translate }}</span>

  <textarea class="xml-textarea" placeholder='<?xml version="1.0" encoding="UTF-8"?>'
            [(ngModel)]="xmlTextAreaContent"></textarea>

  <div class="actions-row">
    <button class="btn btn--primary analyse" (click)="emitValue()">
      {{ 'actions.analyzeAndImport' | translate }}
    </button>
    <button class="btn btn--ghost" (click)="fillTextAreaWithExample()">{{ 'actions.example' | translate }}</button>
    <button class="btn btn--ghost" (click)="removeTextFromTextArea()">{{ 'actions.clear' | translate }}</button>
  </div>
</section>
